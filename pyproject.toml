[project]
name = "threat-emulation"
version = "0.0.1"
description = "Automated Agentic RAG Threat Emulation Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Threat-Emulation Contributors" },
]
keywords = [
    "mitre-attack",
    "atomic-red-team",
    "threat-emulation",
    "agentic-ai",
    "rag",
    "cybersecurity",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "anthropic>=0.40,<1",
    "httpx>=0.27,<1",
    "structlog>=24.1,<25",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
rag = [
    "qdrant-client>=1.10,<2",
    "rank-bm25>=0.2.2,<1",
    "networkx>=3.3,<4",
    "voyageai>=0.2.3,<1",
    "sentence-transformers>=3.0,<4",
]
intel = [
    "stix2>=3.0,<4",
    "taxii2-client>=2.3,<3",
    "pymisp>=2.4,<3",
    "pycti>=6.2,<7",
]
api = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-jose[cryptography]>=3.3,<4",
    "authlib>=1.3,<2",
]
observability = [
    "opentelemetry-sdk>=1.25,<2",
    "opentelemetry-exporter-otlp>=1.25,<2",
    "prometheus-client>=0.20,<1",
]
dev = [
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "pytest-asyncio>=0.23,<1",
    "types-pyyaml>=6.0,<7",
]

[project.scripts]
threat-emu = "threat_emulation.cli:app"

[project.urls]
Repository = "https://github.com/AlbshriAdel/Threat-Emulation"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threat_emulation"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "pytest-asyncio>=0.23,<1",
    "types-pyyaml>=6.0,<7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line length handled by formatter
    "S101",  # asserts ok in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "rank_bm25.*",
    "stix2.*",
    "taxii2client.*",
    "pymisp.*",
    "pycti.*",
    "voyageai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires external services (lab, vector store)",
    "slow: long-running tests",
]

[tool.coverage.run]
source = ["src/threat_emulation"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
